{% extends "userHome.html" %}
{% block content %}

<br><br><br><br>

<section id="featured-products" class="section py-5 bg-light">

  <!-- Section Title -->
  <div class="container text-center mb-4" data-aos="fade-up">
    <h2 class="fw-bold">Add Feedback</h2>
    <p class="text-muted">Share your experience with the product</p>
  </div>

  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <form action="" method="post" class="card shadow-sm border-0 p-4">
          {% csrf_token %}

          <h5 class="fw-semibold mb-4 text-center">Your Feedback</h5>

          <!-- Rating -->
          <div class="mb-4">
            <label class="form-label fw-semibold mb-2">Rating</label>

            <style>
              .star-rating {
                display: flex;
                gap: 10px;
                font-size: 30px;
              }

              .star {
                cursor: pointer;
                color: #ddd;
                transition: color 0.2s ease;
              }

              .star.active {
                color: #ffc107;
              }
            </style>

            <div class="star-rating" id="starRating">
              <!-- Hidden input sent to backend -->
              <input type="hidden" name="rating" id="ratingValue" required>

              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
          </div>

          <!-- Comment -->
          <div class="mb-4">
            <label for="comment" class="form-label fw-semibold">Comment</label>
            <textarea
              name="comment"
              id="comment"
              class="form-control"
              rows="4"
              placeholder="Write your feedback here..."
              required></textarea>
          </div>

          <!-- Submit Button -->
          <div class="text-end">
            <button type="submit" class="btn btn-primary px-4">
              Submit Feedback
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</section>

<script>
  const stars = document.querySelectorAll('.star');
  const ratingInput = document.getElementById('ratingValue');

  stars.forEach(star => {
    star.addEventListener('mouseover', () => {
      highlightStars(star.dataset.value);
    });

    star.addEventListener('click', () => {
      ratingInput.value = star.dataset.value;
      highlightStars(star.dataset.value);
    });

    star.addEventListener('mouseout', () => {
      highlightStars(ratingInput.value);
    });
  });

  function highlightStars(value) {
    stars.forEach(star => {
      star.classList.toggle('active', star.dataset.value <= value);
    });
  }
</script>

{% endblock %}
