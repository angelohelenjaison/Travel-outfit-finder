{% extends "index.html" %}
{% block content %}
  <section id="travel-hero" class="travel-hero section dark-background">
    <div class="hero-background">
      <video autoplay muted loop>
        <source src="static/assets/img/travel/video-2.mp4" type="video/mp4">
      </video>
      <div class="hero-overlay"></div>
    </div>

    <div class="container position-relative">
      <div class="row align-items-center">
        <div class="col-lg-7"></div>

        <center>
          <div class="col-lg-6">
          <div class="booking-form-wrapper" data-aos="fade-left" data-aos-delay="200">
            <div class="booking-form">
              <h3 class="form-title">USER REGISTRATION</h3>
              <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group mb-3">
                  <label>ENTER YOUR FULL NAME</label>
                  <input type="text" name="fullname" class="form-control" required pattern="[A-Za-z ]+">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR PHONE NUMBER</label>
                  <input type="tel" name="phone" minlength="10" maxlength="10" class="form-control" required pattern="[6789][0-9]{9}">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR EMAIL ID</label>
                  <input type="email" name="email" class="form-control" required>
                </div>
                
                <div class="form-group mb-3">
                  <label>PASSWORD</label>
                  <input type="password" name="password" class="form-control" required minlength="8">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR ADDRESS</label>
                  <textarea name="address" class="form-control" required></textarea>
                </div>
                
                <button type="submit" name="register" class="btn btn-primary w-100">REGISTER</button>
              </form>
              <br>
            
            </div>
          </div>
        </div>
        </center>
      </div>
    </div>
  </section>

{% endblock %}
