{% extends "userHome.html" %}
{% block content %}

<br><br><br><br>

<!-- Booking Section -->
<section id="featured-products" class="featured-products section py-5 bg-light">

  <!-- Section Title -->
  <div class="container text-center mb-4" data-aos="fade-up">
    <h2 class="fw-bold">Book Now</h2>
    <p class="text-muted">Fill the form below to make your booking</p>
  </div>

  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow p-4">

          <form method="post" action="">
            {% csrf_token %}

            <!-- Date -->
            <div class="mb-3">
              <label for="bdate" class="form-label">From Date</label>
              <input type="date" name="bdate" id="bdate" class="form-control"
                min="2026-01-01" 
                max="2099-12-31" required>
            </div>

            <!-- Date -->
            <div class="mb-3">
              <label for="bdate" class="form-label">To Date</label>
              <input type="date" name="todate" id="bdate" class="form-control"
                min="2026-01-01" 
                max="2099-12-31"
              required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="description" class="form-label">Description / Notes</label>
              <textarea name="description" id="description" class="form-control" rows="4" placeholder="Write any special requests or notes..." required></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100">Book Now</button>

          </form>

        </div>

      </div>
    </div>

  </div>
</section>
<!-- End Booking Section -->

{% endblock %}
