{% extends "userHome.html" %}
{% block content %}

<br><br><br><br>


<!-- Featured Products Section -->
<section id="featured-products" class="featured-products section py-5 bg-light">

  <!-- Section Title -->
  <div class="container mb-4" data-aos="fade-up">
    <div class="text-center mb-5">
      <h2 class="fw-bold">My Profile</h2>
      <p class="text-muted">Update Your Profile Information</p>
    </div>

    <!-- Profile Update Form -->
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-5" data-aos="fade-up" data-aos-delay="100">
          <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group mb-3">
                  <label>ENTER YOUR FULL NAME</label>
                  <input type="text" name="fullname" class="form-control" value="{{ user.name }}" required pattern="[A-Za-z ]+">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR PHONE NUMBER</label>
                  <input type="tel" name="phone" value="{{ user.phone }}" minlength="10" maxlength="10" class="form-control" required pattern="[6789][0-9]{9}">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR EMAIL ID</label>
                  <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                
                <div class="form-group mb-3">
                  <label>PASSWORD</label>
                  <input type="password" name="password"  class="form-control" minlength="8">
                </div>
                
                <div class="form-group mb-3">
                  <label>ENTER YOUR ADDRESS</label>
                  <textarea name="address" class="form-control" required>{{ user.address }}</textarea>
                </div>
                
                <button type="submit" name="register" class="btn btn-primary w-100">REGISTER</button>
              </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Featured Products Section -->





{% endblock %}
