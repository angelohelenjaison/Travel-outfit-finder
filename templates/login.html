 {% extends "index.html" %}
{% block content %}

<!-- Main -->

  <section id="login-hero" class="travel-hero section dark-background">
    <div class="hero-background">
      <video autoplay muted loop>
        <source src="static/assets/img/travel/video-2.mp4" type="video/mp4">
      </video>
      <div class="hero-overlay"></div>
    </div>

    <div class="container position-relative">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="booking-form-wrapper" data-aos="fade-up" data-aos-delay="100">
            <div class="booking-form">
              <h3 class="form-title">LOGIN</h3>
              <form action="" method="post">
                {% csrf_token %}
                <div class="form-group mb-3">
                  <label for="login-email">EMAIL ID</label>
                  <input type="text" name="email" id="login-email" class="form-control" required>
                </div>
                <div class="form-group mb-3">
                  <label for="login-password">PASSWORD</label>
                  <input type="password" name="password" id="login-password" class="form-control" required>
                </div>
                <button type="submit" name="sub" class="btn btn-primary w-100">Login</button>
                <p class="mt-3 text-center">Don't have an account? <br><br> 
                  <a href="/userregistration ">Register as user</a>
                </p>
                <p class="mt-3 text-center"> 
                  <a href="/supplierreg">Register as Supplier</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

<!-- End Main -->

{% endblock %}
